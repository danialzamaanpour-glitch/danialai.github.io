<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orca AI Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="topbar">
            <div class="brand">
                <div class="logo">✦</div>
                <div>
                    <h1>Orca AI</h1>
                    <p>Qwen 3.8 27B Free</p>
                </div>
            </div>
            <button id="clearBtn" class="icon-btn" title="Clear chat">⌫</button>
        </header>

        <main id="chat" class="chat">
            <div class="welcome">
                <div class="welcome-icon">✦</div>
                <h2>How can I help?</h2>
                <p>Ask anything. Your messages are sent to the real Qwen model through OrcaRouter.</p>
            </div>
        </main>

        <div id="status" class="status"></div>

        <form id="messageForm" class="composer">
            <textarea
                id="messageInput"
                rows="1"
                placeholder="Message Orca AI..."
                autocomplete="off"
            ></textarea>
            <button id="sendBtn" type="submit" aria-label="Send message">➤</button>
        </form>

        <div class="footer">Powered by OrcaRouter • qwen/qwen3.8-27b-free</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
